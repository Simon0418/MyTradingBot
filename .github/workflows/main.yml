name: Daily Trading Dashboard

on:
  schedule:
    - cron: '0 * * * *'  # 👈 核心修改：每小時的 00 分自動觸發
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 檢查程式碼
        uses: actions/checkout@v3

      - name: 設定 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy
          pip install yfinance pandas numpy pytz requests  # <-- 確保這裡有加上 pytz 和 requests

      - name: 執行腳本
        run: python Strategy_V7.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html  # <-- 確保這裡是 index.html
          git commit -m "Automated update: Trading Dashboard" || echo "No changes to commit"
          git push
